name: Mobile Production Release

on:
  push:
    tags:
      - 'mobile-v*.*.*' # Triggers on tags like mobile-v1.0.0, mobile-v1.2.3, etc.
  workflow_dispatch: # Allow manual trigger
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      version: ${{ steps.extract.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: extract
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/mobile-v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      - name: Verify version format
        run: |
          VERSION="${{ steps.extract.outputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $VERSION"
            echo "Expected format: X.Y.Z (e.g., 1.0.0)"
            exit 1
          fi

      - name: Check if version matches package.json
        run: |
          PACKAGE_VERSION=$(node -p "require('./apps/mobile/package.json').version")
          TAG_VERSION="${{ steps.extract.outputs.version }}"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch!"
            echo "package.json version: $PACKAGE_VERSION"
            echo "Tag version: $TAG_VERSION"
            echo "Please update package.json version to match the tag"
            exit 1
          fi

          echo "Version verified: $PACKAGE_VERSION"

  build-android:
    name: Build Android Production
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Load secrets from Doppler
        working-directory: apps/mobile
        run: doppler secrets download --no-file --format env-no-quotes > .env
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRODUCTION }}

      - name: Build Android for Play Store
        working-directory: apps/mobile
        run: |
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --auto-submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  publish-update:
    name: Publish Production OTA Update
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish OTA update to production channel
        working-directory: apps/mobile
        run: |
          eas update \
            --branch production \
            --message "Production release v${{ needs.validate.outputs.version }}" \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, build-android, publish-update]
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            # First release
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --reverse)
          else
            # Generate changelog from previous tag
            CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --reverse)
          fi

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: mobile-v${{ needs.validate.outputs.version }}
          release_name: Mobile v${{ needs.validate.outputs.version }}
          body: |
            ## SuitUp Mobile v${{ needs.validate.outputs.version }}

            ### What's New
            ${{ steps.changelog.outputs.changelog }}

            ### Deployment Status
            - ✅ Android: Submitted to Google Play Console (pending review)
            - ✅ OTA Update: Published to production channel

            ### Distribution
            - **Android Internal Testing**: Available for beta testers
            - **Production**: Will be available after store review approval

            ### Monitoring
            - [View Android Build](https://expo.dev/accounts/${{ secrets.EXPO_USERNAME }}/projects/suitup/builds)
            - [Sentry Releases](https://sentry.io/organizations/${{ secrets.SENTRY_ORG }}/projects/${{ secrets.SENTRY_PROJECT }}/releases/)

            **Note**: This app is Android-only. iOS support has been removed.
          draft: false
          prerelease: false

  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [validate, create-release]
    if: always()

    steps:
      - name: Check deployment status
        run: |
          if [[ "${{ needs.create-release.result }}" == "success" ]]; then
            echo "✅ Production release v${{ needs.validate.outputs.version }} deployed successfully!"
          else
            echo "❌ Production release v${{ needs.validate.outputs.version }} failed!"
            exit 1
          fi
